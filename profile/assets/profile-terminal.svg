<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Gaurav Kumar — terminal profile card</title>
  <desc id="desc">Animated terminal card showing whoami, pinned projects, and contact details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A08"/>
      <stop offset="1" stop-color="#0B0F0C"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#7CFFB2" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1000 30) rotate(140) scale(460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CFFB2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#7CFFB2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: url(#bg); }
    .grid { fill: url(#grid); }
    .glow { fill: url(#glow); }
    .green { fill: #7CFFB2; }
    .amber { fill: #FFC857; }
    .cyan { fill: #67E8F9; }
    .text { fill: #D9E6DC; }
    .muted { fill: #8A9A8F; }
    .dim { fill: #6F7F74; }
    .border { stroke: #1D2A21; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .scan { animation: scan 10s linear infinite; }
    .line { opacity: 1; animation: line-in .35s ease both; }
    .l1 { animation-delay: .15s; }
    .l2 { animation-delay: .30s; }
    .l3 { animation-delay: .55s; }
    .l4 { animation-delay: .70s; }
    .l5 { animation-delay: .85s; }
    .l6 { animation-delay: 1.0s; }
    .l7 { animation-delay: 1.15s; }
    .l8 { animation-delay: 1.3s; }
    .l9 { animation-delay: 1.45s; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes line-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scan { 0% { transform: translateY(-160px); } 100% { transform: translateY(540px); } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .scan, .line { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <rect class="bg" x="1" y="1" width="1198" height="518" rx="12" stroke="#1D2A21"/>
  <rect class="grid" x="1" y="1" width="1198" height="518" rx="12"/>
  <rect class="glow" x="1" y="1" width="1198" height="518" rx="12"/>

  <g>
    <path d="M1 42h1198" stroke="#1D2A21"/>
    <circle cx="26" cy="22" r="5" fill="#FF5F56"/>
    <circle cx="44" cy="22" r="5" fill="#FFBD2E"/>
    <circle cx="62" cy="22" r="5" fill="#27C93F"/>
    <text x="600" y="26" text-anchor="middle" class="mono dim" font-size="10" letter-spacing="1.2">gaurav@github: ~ — zsh</text>
    <circle cx="1160" cy="22" r="4" fill="#7CFFB2"/>
    <text x="1148" y="26" text-anchor="end" class="mono green" font-size="9" letter-spacing="1">ONLINE</text>
  </g>

  <g class="mono" font-size="15">
    <g class="line l1">
      <text x="36" y="84" class="green">gaurav@github</text><text x="142" y="84" class="dim">:~$ </text><text x="166" y="84" class="text">whoami</text>
    </g>
    <g class="line l2">
      <text x="36" y="112" class="muted">gaurav kumar — full-stack &amp; ai engineer</text>
    </g>

    <g class="line l3">
      <text x="36" y="154" class="green">gaurav@github</text><text x="142" y="154" class="dim">:~$ </text><text x="166" y="154" class="text">cat pinned.json</text>
    </g>
    <g class="line l4">
      <text x="52" y="184" class="dim">{</text>
    </g>
    <g class="line l5">
      <text x="68" y="210" class="cyan">"OpenDocs"</text><text x="158" y="210" class="dim">: </text><text x="172" y="210" class="green">"real-time collaboration"</text>
    </g>
    <g class="line l6">
      <text x="68" y="236" class="cyan">"Lingo"</text><text x="122" y="236" class="dim">: </text><text x="136" y="236" class="green">"gamified learning"</text>
    </g>
    <g class="line l7">
      <text x="68" y="262" class="cyan">"Learnify"</text><text x="146" y="262" class="dim">: </text><text x="160" y="262" class="green">"AI study assistant"</text>
    </g>
    <g class="line l8">
      <text x="68" y="288" class="cyan">"DeployHub"</text><text x="162" y="288" class="dim">: </text><text x="176" y="288" class="green">"deployment platform"</text>
    </g>
    <g class="line l9">
      <text x="68" y="314" class="cyan">"FoodVision"</text><text x="164" y="314" class="dim">: </text><text x="178" y="314" class="green">"computer vision"</text>
    </g>
    <g class="line l9">
      <text x="68" y="340" class="cyan">"MeloSynthiaAI"</text><text x="202" y="340" class="dim">: </text><text x="216" y="340" class="green">"AI music marketplace"</text>
    </g>
    <g class="line l9">
      <text x="52" y="366" class="dim">}</text>
    </g>

    <g class="line l9">
      <text x="36" y="408" class="green">gaurav@github</text><text x="142" y="408" class="dim">:~$ </text><text x="166" y="408" class="text">./contact.sh</text>
    </g>
    <g class="line l9">
      <text x="36" y="436" class="green">→ gauravkum2002@gmail.com</text>
    </g>
    <g class="line l9">
      <text x="36" y="472" class="dim">[ok] open for select projects</text>
      <text x="36" y="494" class="green">❯ </text><text class="cursor green">▊</text>
    </g>
  </g>

  <rect x="0" y="-160" width="1200" height="160" fill="url(#glow)" class="scan" opacity=".55"/>
</svg>