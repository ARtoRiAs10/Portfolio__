<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Gaurav Kumar — GitHub profile banner</title>
  <desc id="desc">Terminal-inspired animated banner for full-stack and AI engineer Gaurav Kumar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A08"/>
      <stop offset=".55" stop-color="#0B0F0C"/>
      <stop offset="1" stop-color="#070A08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 40) rotate(138) scale(520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CFFB2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7CFFB2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#7CFFB2" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: url(#bg); }
    .grid { fill: url(#grid); }
    .glow { fill: url(#glow); }
    .green { fill: #7CFFB2; }
    .amber { fill: #FFC857; }
    .cyan { fill: #67E8F9; }
    .text { fill: #D9E6DC; }
    .muted { fill: #8A9A8F; }
    .dim { fill: #6F7F74; }
    .border { stroke: #1D2A21; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .float-a { animation: float 7s ease-in-out infinite; }
    .float-b { animation: float 9s ease-in-out infinite reverse; }
    .scan { animation: scan 9s linear infinite; }
    .pulse { animation: pulse 2.4s ease-out infinite; transform-origin: 1090px 62px; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes scan { 0% { transform: translateY(-140px); } 100% { transform: translateY(460px); } }
    @keyframes pulse { 0% { transform: scale(.6); opacity: .8; } 70%, 100% { transform: scale(1.8); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .float-a, .float-b, .scan, .pulse { animation: none !important; }
    }
  </style>

  <rect class="bg" width="1200" height="400"/>
  <rect class="grid" width="1200" height="400"/>
  <rect class="glow" width="1200" height="400"/>

  <g opacity=".55">
    <circle class="float-a green" cx="1080" cy="300" r="3"/>
    <circle class="float-b cyan" cx="1110" cy="250" r="2"/>
    <circle class="float-a amber" cx="1030" cy="330" r="2"/>
    <path d="M980 300h20M990 290v20" stroke="#7CFFB2" stroke-opacity=".35"/>
  </g>

  <g>
    <rect x="64" y="52" width="48" height="48" rx="6" fill="#0B0F0C" stroke="#355040"/>
    <text x="88" y="83" text-anchor="middle" class="mono green" font-size="15" font-weight="700">GK</text>
    <text x="126" y="72" class="mono text" font-size="17">Gaurav Kumar</text>
    <text x="126" y="91" class="mono muted" font-size="9" letter-spacing="2">FREELANCE ENGINEER</text>
  </g>

  <g>
    <rect x="962" y="54" width="174" height="30" rx="15" fill="#7CFFB2" fill-opacity=".06" stroke="#355040"/>
    <circle class="pulse" cx="980" cy="69" r="4" fill="#7CFFB2"/>
    <circle cx="980" cy="69" r="3" class="green"/>
    <text x="993" y="73" class="mono green" font-size="9" letter-spacing="1.2">OPEN FOR SELECT PROJECTS</text>
  </g>

  <g>
    <text x="64" y="172" class="mono muted" font-size="10" letter-spacing="2.6">PORTFOLIO / GITHUB PROFILE</text>
    <text x="64" y="244" class="mono text" font-size="62" letter-spacing="-3">I build software</text>
    <text x="64" y="308" class="mono text" font-size="62" letter-spacing="-3">that feels <tspan class="green" font-style="italic">inevitable.</tspan></text>
  </g>

  <g>
    <rect x="64" y="332" width="590" height="34" rx="4" fill="#0B0F0C" stroke="#1D2A21"/>
    <text x="78" y="354" class="mono" font-size="11">
      <tspan fill="#7CFFB2">gaurav@github</tspan><tspan fill="#6F7F74">:~$ </tspan><tspan fill="#D9E6DC">whoami</tspan>
      <tspan class="cursor" fill="#7CFFB2">▊</tspan>
    </text>
  </g>

  <g>
    <text x="64" y="386" class="mono dim" font-size="9" letter-spacing="1">github.com/ARtoRiAs10</text>
    <text x="430" y="386" class="mono dim" font-size="9" letter-spacing="1">gauravkum2002@gmail.com</text>
    <text x="1136" y="386" text-anchor="end" class="mono dim" font-size="9" letter-spacing="1">2024 — 2026</text>
  </g>

  <g opacity=".45">
    <rect x="0" y="-140" width="1200" height="140" fill="url(#glow)" class="scan"/>
  </g>

  <rect x=".5" y=".5" width="1199" height="399" stroke="#1D2A21"/>
</svg>