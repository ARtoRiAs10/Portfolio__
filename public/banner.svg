<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040806"/>
      <stop offset="0.55" stop-color="#07110e"/>
      <stop offset="1" stop-color="#0a1c1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(880 340) rotate(90) scale(300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7cffb2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7cffb2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="620" y1="430" x2="1140" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b3b4a"/>
      <stop offset="0.5" stop-color="#0e5360"/>
      <stop offset="1" stop-color="#08222e"/>
    </linearGradient>
    <linearGradient id="islandTop" x1="700" y1="330" x2="1060" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f7d4a"/>
      <stop offset="1" stop-color="#1a4a2e"/>
    </linearGradient>
    <linearGradient id="rock" x1="880" y1="410" x2="880" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a2818"/>
      <stop offset="1" stop-color="#1c130d"/>
    </linearGradient>
    <linearGradient id="screen" x1="810" y1="310" x2="950" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7cffb2"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#7cffb2" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tinyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="880" cy="340" rx="320" ry="300" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#d9e6dc" opacity="0.55">
    <circle cx="90" cy="70" r="1.5"/><circle cx="170" cy="120" r="1"/><circle cx="260" cy="60" r="1.2"/>
    <circle cx="340" cy="110" r="1"/><circle cx="430" cy="55" r="1.4"/><circle cx="520" cy="120" r="1"/>
    <circle cx="640" cy="70" r="1.2"/><circle cx="720" cy="130" r="1"/><circle cx="1120" cy="80" r="1.4"/>
    <circle cx="1160" cy="150" r="1"/><circle cx="1040" cy="60" r="1.2"/><circle cx="80" cy="240" r="1"/>
  </g>

  <!-- clouds -->
  <g fill="#d9e6dc" opacity="0.05">
    <ellipse cx="250" cy="190" rx="90" ry="18"/>
    <ellipse cx="300" cy="180" rx="60" ry="14"/>
    <ellipse cx="1050" cy="150" rx="80" ry="16"/>
    <ellipse cx="1100" cy="140" rx="50" ry="12"/>
  </g>

  <!-- left copy -->
  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="64" y="92" fill="#7cffb2" font-size="12" letter-spacing="3">// PORTFOLIO V1.0 — DUAL MODE</text>
    <text x="64" y="178" fill="#e8f6ec" font-size="70" font-weight="700" letter-spacing="-2">GAURAV</text>
    <text x="64" y="248" fill="#e8f6ec" font-size="70" font-weight="700" letter-spacing="-2">KUMAR</text>
    <text x="64" y="286" fill="#7cffb2" font-size="16" letter-spacing="4">FULL-STACK &amp; AI ENGINEER</text>
    <text x="64" y="332" fill="#b9c9bd" font-size="19">I build fast Next.js SaaS apps</text>
    <text x="64" y="358" fill="#b9c9bd" font-size="19">and AI workflows that ship on time.</text>

    <!-- chips -->
    <g transform="translate(64 394)">
      <rect width="108" height="28" rx="3" fill="#7cffb2" fill-opacity="0.08" stroke="#7cffb2" stroke-opacity="0.35"/>
      <text x="12" y="18" fill="#7cffb2" font-size="10" letter-spacing="1.5">3D WORLD</text>
      <rect x="118" width="74" height="28" rx="3" fill="#67e8f9" fill-opacity="0.07" stroke="#67e8f9" stroke-opacity="0.3"/>
      <text x="130" y="18" fill="#67e8f9" font-size="10" letter-spacing="1.5">CLI</text>
      <rect x="202" width="142" height="28" rx="3" fill="#ffc857" fill-opacity="0.07" stroke="#ffc857" stroke-opacity="0.3"/>
      <text x="214" y="18" fill="#ffc857" font-size="10" letter-spacing="1.5">15 CASE STUDIES</text>
    </g>

    <line x1="64" y1="500" x2="520" y2="500" stroke="#1d2a21"/>
    <text x="64" y="536" fill="#7cffb2" font-size="11" letter-spacing="2">OPEN FOR SELECT PROJECTS</text>
    <text x="64" y="560" fill="#6f7f74" font-size="10" letter-spacing="1.5">REMOTE / WORLDWIDE · 2024—2026</text>
    <text x="64" y="596" fill="#6f7f74" font-size="10" letter-spacing="1">$ help · ls projects · estimate · hire</text>
  </g>

  <!-- island water -->
  <ellipse cx="880" cy="478" rx="292" ry="74" fill="url(#water)" opacity="0.75"/>
  <ellipse cx="880" cy="472" rx="250" ry="58" fill="#67e8f9" opacity="0.05"/>

  <!-- island rock -->
  <path d="M666 414 L1094 414 L1054 492 L1002 520 L948 506 L900 536 L846 508 L792 522 L738 492 Z" fill="url(#rock)"/>
  <path d="M666 414 L1094 414 L1074 442 L1010 458 L944 446 L880 468 L812 446 L748 460 L690 440 Z" fill="#2a1b10" opacity="0.85"/>

  <!-- island top -->
  <ellipse cx="880" cy="404" rx="214" ry="58" fill="#3a2818"/>
  <ellipse cx="880" cy="396" rx="214" ry="56" fill="url(#islandTop)"/>
  <ellipse cx="880" cy="388" rx="198" ry="48" fill="#2f7d4a" opacity="0.75"/>
  <ellipse cx="880" cy="384" rx="170" ry="38" fill="#3f9a5a" opacity="0.35"/>

  <!-- path -->
  <path d="M790 404 C820 390 850 420 880 404 C910 388 940 418 970 404" stroke="#2a3f30" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- terminal monitor -->
  <g filter="url(#softGlow)">
    <rect x="782" y="286" width="176" height="106" rx="8" fill="#0b1510" stroke="#355040" stroke-width="2"/>
    <rect x="794" y="298" width="152" height="78" rx="3" fill="url(#screen)" opacity="0.92"/>
    <g font-family="'JetBrains Mono','Courier New',monospace" font-size="7" fill="#04110a">
      <text x="802" y="312">gaurav@portfolio:~$ help</text>
      <text x="802" y="324">ls projects</text>
      <text x="802" y="336">open orchestra</text>
      <text x="802" y="348">services · estimate</text>
      <text x="802" y="360">sudo hire-me</text>
    </g>
    <rect x="848" y="392" width="44" height="10" fill="#2a1b10"/>
    <rect x="832" y="402" width="76" height="6" rx="3" fill="#1c130d"/>
  </g>

  <!-- rover -->
  <g transform="translate(880 350)">
    <ellipse cx="0" cy="38" rx="54" ry="10" fill="#04110a" opacity="0.35"/>
    <rect x="-44" y="-6" width="88" height="32" rx="8" fill="#ffc857"/>
    <rect x="-26" y="-26" width="52" height="24" rx="6" fill="#0b1510"/>
    <rect x="-18" y="-20" width="36" height="10" rx="2" fill="#7cffb2" opacity="0.9"/>
    <rect x="-34" y="18" width="12" height="8" rx="2" fill="#ff8fa3"/>
    <rect x="22" y="18" width="12" height="8" rx="2" fill="#ff8fa3"/>
    <g fill="#111827">
      <circle cx="-30" cy="28" r="14"/><circle cx="30" cy="28" r="14"/>
    </g>
    <g fill="#ffc857">
      <circle cx="-30" cy="28" r="5"/><circle cx="30" cy="28" r="5"/>
    </g>
    <rect x="-4" y="-40" width="8" height="18" rx="3" fill="#d9e6dc"/>
    <circle cx="0" cy="-44" r="5" fill="#ff8fa3" filter="url(#tinyGlow)"/>
    <rect x="-42" y="-2" width="10" height="6" rx="2" fill="#fff2d0" filter="url(#tinyGlow)"/>
    <rect x="32" y="-2" width="10" height="6" rx="2" fill="#fff2d0" filter="url(#tinyGlow)"/>
  </g>

  <!-- floating blocks -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="8" text-anchor="middle">
    <g transform="translate(700 252)">
      <rect x="-24" y="-24" width="48" height="48" rx="4" fill="#0b1510" stroke="#7cffb2" stroke-opacity="0.5"/>
      <text x="0" y="4" fill="#7cffb2">TS</text>
    </g>
    <g transform="translate(1046 280)">
      <rect x="-24" y="-24" width="48" height="48" rx="4" fill="#0b1510" stroke="#ffc857" stroke-opacity="0.5"/>
      <text x="0" y="4" fill="#ffc857">AI</text>
    </g>
    <g transform="translate(1000 190)">
      <rect x="-28" y="-24" width="56" height="48" rx="4" fill="#0b1510" stroke="#67e8f9" stroke-opacity="0.5"/>
      <text x="0" y="4" fill="#67e8f9">NEXT</text>
    </g>
  </g>

  <!-- portal ring -->
  <g filter="url(#softGlow)">
    <ellipse cx="1050" cy="400" rx="34" ry="60" stroke="#67e8f9" stroke-width="4" opacity="0.8"/>
    <ellipse cx="1050" cy="400" rx="24" ry="48" stroke="#7cffb2" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- foreground grass tufts -->
  <g stroke="#3f9a5a" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M730 410 L726 396"/><path d="M736 410 L738 394"/><path d="M1010 412 L1006 398"/><path d="M1016 412 L1018 396"/>
  </g>

  <!-- corner frame -->
  <path d="M24 24 H120 M24 24 V120" stroke="#7cffb2" stroke-opacity="0.35"/>
  <path d="M1176 24 H1080 M1176 24 V120" stroke="#7cffb2" stroke-opacity="0.35"/>
  <path d="M24 606 H120 M24 606 V510" stroke="#7cffb2" stroke-opacity="0.2"/>
  <path d="M1176 606 H1080 M1176 606 V510" stroke="#7cffb2" stroke-opacity="0.2"/>
</svg>